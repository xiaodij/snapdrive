name: SnapDrive
options:
  bundleIdPrefix: com.xiaodijin
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  SnapDrive:
    type: application
    platform: iOS
    sources:
      - path: SnapDrive
    # All fork-specific values (bundle id, team, client id, tenant) live here.
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    info:
      path: SnapDrive/Info.plist
      properties:
        CFBundleDisplayName: SnapDrive
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: AccentColor
        # iPad is in TARGETED_DEVICE_FAMILY, and iPad apps must support all four
        # orientations unless they declare UIRequiresFullScreen.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: >-
          SnapDrive uses the camera to scan documents so they can be cropped,
          cleaned up and uploaded to your OneDrive.
        NSPhotoLibraryAddUsageDescription: >-
          SnapDrive can save a copy of a scanned PDF to your photo library.
        # Read at runtime by Config.swift, substituted from Config.xcconfig at
        # build time so there is exactly one place to edit.
        SnapClientID: $(SNAP_CLIENT_ID)
        SnapTenant: $(SNAP_TENANT)
        # Derived from the bundle id, so the redirect URI can never drift from it.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).auth
            CFBundleURLSchemes:
              - msauth.$(PRODUCT_BUNDLE_IDENTIFIER)
    settings:
      base:
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
